name: World Phase Probe WebKit

on:
  push:
    branches:
      - diagnostic/world-freeze-recovery-20260916-exec
    paths:
      - 'probe/**'
      - '.github/workflows/world-phase-probe-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bug lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Probe World phases in WebKit
        shell: bash
        run: |
          chmod +x probe/run-world-phase-probe-webkit.sh
          probe/run-world-phase-probe-webkit.sh
      - name: Upload phase evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-phase-probe-webkit-evidence
          path: probe-artifacts/
          retention-days: 14
          if-no-files-found: warn
