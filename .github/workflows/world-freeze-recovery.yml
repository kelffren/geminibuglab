name: World Freeze Recovery Lab

on:
  push:
    branches:
      - diagnostic/world-freeze-recovery-20260916-exec
    paths:
      - 'lab/**'
      - '.github/workflows/world-freeze-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-world-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bug lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Validate checkpoints and bisect current regression in WebKit
        id: isolate
        continue-on-error: true
        shell: bash
        run: |
          chmod +x lab/run-world-regression-webkit.sh
          lab/run-world-regression-webkit.sh

      - name: Preserve diagnostic result
        if: ${{ always() }}
        run: |
          mkdir -p lab-artifacts-webkit
          echo "step_outcome=${{ steps.isolate.outcome }}" > lab-artifacts-webkit/workflow-result.txt
          echo "head=${GITHUB_SHA}" >> lab-artifacts-webkit/workflow-result.txt

      - name: Upload Recovery Mesh WebKit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-freeze-recovery-webkit-evidence
          path: lab-artifacts-webkit/
          retention-days: 14
          if-no-files-found: warn
