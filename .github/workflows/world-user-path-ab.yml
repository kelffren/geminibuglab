name: World User Path A B

on:
  push:
    branches:
      - diagnostic/world-freeze-recovery-20260916-exec
    paths:
      - 'lab/user-path-world-webkit.mjs'
      - '.github/workflows/world-user-path-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-path-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bug lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Reproduce normal user path across catalog boundary
        shell: bash
        run: |
          set -u
          LAB="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/kelo-user-path-ab"
          ART="$LAB/user-path-ab-artifacts"
          RUNNER="$LAB/lab/user-path-world-webkit.mjs"
          mkdir -p "$ART"
          git clone --quiet https://github.com/kelffren/gemini.git "$WORK"
          cd "$WORK"
          git checkout --detach -q ea0dc18a55007351cfdccb37fda5ed1faca9eac3
          npm install --no-audit --no-fund >/tmp/user-path-ab-npm.log 2>&1
          npx playwright install webkit --with-deps

          test_one(){
            sha="$1"; label="$2"
            git reset --hard -q
            git clean -ffd -e node_modules >/dev/null 2>&1 || true
            if ! git checkout --detach -q "$sha"; then echo "$label $sha rc=125 checkout" | tee -a "$ART/results.txt"; return; fi
            npm install --no-audit --no-fund >/tmp/user-path-ab-npm.log 2>&1 || { echo "$label $sha rc=125 npm" | tee -a "$ART/results.txt"; return; }
            cp "$RUNNER" scripts/__lab-user-path-webkit.mjs
            python3 -m http.server 4173 --bind 127.0.0.1 >"$ART/http-${label}.log" 2>&1 & server=$!
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1 && break; sleep .2; done
            set +e
            timeout 65s node scripts/__lab-user-path-webkit.mjs --sha="$sha" --out="$ART" --base=http://127.0.0.1:4173/ >>"$ART/run-log.txt" 2>&1
            rc=$?
            set -e
            kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true
            rm -f scripts/__lab-user-path-webkit.mjs
            echo "$label $sha rc=$rc" | tee -a "$ART/results.txt"
          }

          test_one eda148a32c2862a702aa3d1b863def1a1412d4e5 BEFORE_CATALOG_GATE
          test_one 57660dc1fbe2c95bad6e7dcd8bbe8769c971f712 CATALOG_BEFORE_STUDIO
          test_one 10a70493602628277ede09c7170486c27a1bffd8 CATALOG_RETRY_HARDENING
          test_one ea0dc18a55007351cfdccb37fda5ed1faca9eac3 REPORT_TIME_BAD
          test_one ea098462618ac04bc8b8a628f9227fc0b3337257 REPORT_BASE_FIX
          cat "$ART/results.txt"

      - name: Upload user path evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-user-path-ab-evidence
          path: user-path-ab-artifacts/
          retention-days: 14
          if-no-files-found: warn
